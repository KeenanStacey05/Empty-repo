apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: httpd-replica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      name: httpd-pod
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd-pod
        image: httpd:latest
        ports:
          - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "It works!" > /usr/local/apache2/htdocs/index.html
            echo "Hello world from $(hostname -i)" >> /usr/local/apache2/htdocs/index.html
            exec httpd-foreground
            
